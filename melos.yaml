name: juice_packages
repository: https://github.com/kehmka/juice

packages:
  - packages/**

command:
  bootstrap:
    usePubspecOverrides: true

  version:
    linkToCommits: true
    workspaceChangelog: true

scripts:
  analyze:
    run: dart run melos exec --concurrency=1 --ignore=juice_lint_example -- flutter analyze
    description: Run analyzer in all packages (juice_lint_example is the rules' planted-violation fixture suite — its warnings are the point; lint:juice verifies it)

  test:
    run: dart run melos exec --concurrency=1 --dir-exists=test --ignore=notes_app -- flutter test
    description: Run tests in all packages

  lint:juice:
    run: dart run melos exec --concurrency=1 --scope="chat_app,dashboard,ecommerce,notes_app,social_feed" -- dart analyze --fatal-infos && dart run melos exec --scope=juice_lint -- dart run tool/check_fixtures.dart
    description: juice_lint — dart analyze the five canary apps (plugin rules included) and verify the fixture suite reports exactly its planted diagnostics. dart analyze, not flutter analyze - Flutter 3.47's LSP-based flutter analyze exits when the server finishes, before plugin diagnostics arrive

  skill:check:
    run: tool/sync_skill.sh --check
    description: Fail if skills/juice/references/ has drifted from AGENTS.md, llms.txt, or any package's doc/LLM.md (fix with tool/sync_skill.sh)

  cards:check:
    run: tool/check_cards.sh
    description: Fail if any AI card's front matter (version, requires) has drifted from its pubspec (ISSUES #23) — run before every publish

  format:
    run: dart run melos exec -- sh $MELOS_ROOT_PATH/tool/format.sh
    description: Format all packages

  format:check:
    run: dart run melos exec -- sh $MELOS_ROOT_PATH/tool/format.sh --check
    description: Check formatting in all packages (writes nothing)

  coverage:juice:
    run: sh tool/coverage_check.sh 90
    description: Fail if juice core line coverage drops below 90% (exclusions and reasons in the script)

  ci:
    run: dart run melos run format:check && dart run melos run analyze && dart run melos run test && dart run melos run coverage:juice
    description: Run full CI pipeline

  publish:dry:
    run: dart run melos publish --dry-run
    description: Dry run publish

  publish:
    run: dart run melos publish --no-dry-run
    description: Publish packages
