name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: melos bootstrap

      - name: Format Check
        run: melos run format:check

      - name: Analyze
        run: melos run analyze

      - name: Test Packages
        run: melos run test

      - name: Test Example App
        run: cd example && flutter test

      - name: Core Coverage Gate
        run: sh tool/coverage_check.sh 90

      # juice_lint's analyzer-plugin rules on the five canary apps + the
      # fixture suite. `dart analyze` — Flutter 3.47's `flutter analyze` exits
      # before plugin diagnostics arrive, so the Analyze step can't see them.
      - name: juice_lint
        run: melos run lint:juice
