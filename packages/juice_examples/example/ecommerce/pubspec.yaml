name: ecommerce
description: E-commerce product browser showcasing all Juice packages working together.
publish_to: 'none'

environment:
  sdk: ^3.5.4
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  juice:
    path: ../../../juice
  juice_storage:
    path: ../../../juice_storage
  juice_network:
    path: ../../../juice_network
  juice_routing:
    path: ../../../juice_routing

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # juice_lint dogfood canary: the AGENTS.md idioms as analyzer rules. Run
  # with `dart run custom_lint` — flutter analyze loads the plugin but does
  # not report its diagnostics.
  custom_lint: ^0.8.1
  juice_lint:
    path: ../../../juice_lint

dependency_overrides:
  juice:
    path: ../../../juice
  juice_storage:
    path: ../../../juice_storage
  juice_network:
    path: ../../../juice_network
  juice_routing:
    path: ../../../juice_routing

flutter:
  uses-material-design: true
