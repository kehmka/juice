name: juice_lint_example
description: Fixtures proving juice_lint rules fire (and don't over-fire).
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.9.0

dependencies:
  juice:
    path: ../../juice

# No dev dependency on juice_lint: an analysis_server_plugin plugin is
# enabled in analysis_options.yaml (top-level `plugins:`), and the analysis
# server resolves it in its own synthetic package.
