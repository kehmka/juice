name: juice_packages
repository: https://github.com/kehmka/juice

packages:
  - packages/**

command:
  bootstrap:
    usePubspecOverrides: true

  version:
    linkToCommits: true
    workspaceChangelog: true

scripts:
  analyze:
    run: dart run melos exec --concurrency=1 -- flutter analyze
    description: Run analyzer in all packages

  test:
    run: dart run melos exec --concurrency=1 --dir-exists=test --ignore=notes_app -- flutter test
    description: Run tests in all packages

  lint:juice:
    run: dart run melos exec --concurrency=1 --scope="chat_app,dashboard,ecommerce,notes_app,social_feed" -- dart run custom_lint
    description: Run juice_lint (custom_lint) on the example-app canaries — flutter analyze does not load analyzer plugins

  skill:check:
    run: tool/sync_skill.sh --check
    description: Fail if skills/juice/references/ has drifted from AGENTS.md, llms.txt, or any package's doc/LLM.md (fix with tool/sync_skill.sh)

  cards:check:
    run: tool/check_cards.sh
    description: Fail if any AI card's front matter (version, requires) has drifted from its pubspec (ISSUES #23) — run before every publish

  format:
    run: dart run melos exec -- sh $MELOS_ROOT_PATH/tool/format.sh
    description: Format all packages

  format:check:
    run: dart run melos exec -- sh $MELOS_ROOT_PATH/tool/format.sh --check
    description: Check formatting in all packages (writes nothing)

  coverage:juice:
    run: sh tool/coverage_check.sh 80
    description: Fail if juice core line coverage drops below the gate (exclusions and reasons in the script)

  ci:
    run: dart run melos run format:check && dart run melos run analyze && dart run melos run test && dart run melos run coverage:juice
    description: Run full CI pipeline

  publish:dry:
    run: dart run melos publish --dry-run
    description: Dry run publish

  publish:
    run: dart run melos publish --no-dry-run
    description: Publish packages
