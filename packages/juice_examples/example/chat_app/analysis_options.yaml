include: package:flutter_lints/flutter.yaml

# juice_lint dogfood canary: the AGENTS.md idioms as analyzer rules, as an
# analysis_server_plugin plugin. Its diagnostics are reported by the IDE and
# `dart analyze` — `melos run lint:juice` enforces them here. (Flutter 3.47's
# `flutter analyze` exits before plugin results arrive, so it shows none.)
plugins:
  juice_lint:
    path: ../../../juice_lint
    # Policy rule, ON here (2.0 docket item B, 2026-10-07): every builder in
    # the example apps declares its EventConcurrency mode — these apps teach.
    diagnostics:
      juice_missing_concurrency_mode: true

analyzer:
  exclude:
    - build/**
